<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me" data-i18n="navHome">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" {% if link.key %}data-i18n="{{ link.key }}"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item masthead__menu-item--lang">
            <div class="lang-switcher" role="group" aria-label="Language switcher">
              <button type="button" class="lang-switcher__btn" data-lang-switch="zh" aria-label="切换为中文" aria-pressed="false">中文</button>
              <button type="button" class="lang-switcher__btn" data-lang-switch="en" aria-label="Switch to English" aria-pressed="false">English</button>
            </div>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
